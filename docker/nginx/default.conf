server {
    listen 80;
    server_name _;
    charset utf-8;
    absolute_redirect off;   # 重定向保留端口(非 80 端口部署时必需)
    client_max_body_size 50m;
    client_body_timeout 600;
    proxy_read_timeout 300;

    location = / { return 302 /chapp/; }

    # 前端(Vue, base=/chapp/, hash 路由)
    location /chapp/ {
        alias /usr/share/nginx/html/chapp/;
        try_files $uri $uri/ /chapp/index.html;
    }

    # 业务 API
    location /chapi/ {
        proxy_pass http://api:9978;
        proxy_set_header Host $host;
        proxy_set_header X-Server-Addr $server_addr;
        proxy_set_header X-Server-Port $server_port;
        proxy_set_header X-Protocol-Used $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传通道(原 nginx upload 模块 -> 现由 filesvc 的 uploadShim 等价实现)
    location /upload { proxy_pass http://filesvc:8005; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /hfile  { proxy_pass http://filesvc:8005; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # MCP(streamable-http)
    location /mcp {
        proxy_pass http://mcp:8891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # 本地文件服务(SELFFILE): 临时文件 / 渲染产物 / 预览
    location /temp/    { alias /data/webserver/temp/; }
    location /ch_data/ { alias /data/webserver/ch_data/; }
}
