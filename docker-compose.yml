# contentHub 一键部署: docker compose up -d --build
# 首次启动前: cp .env.example .env 并修改其中的口令
name: contenthub

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    args:
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
  image: contenthub-backend:latest
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    CH_SYS: home
    CH_HOME_DIR: /data/contenthub
    CH_MYSQL_HOST: mysql
    CH_MYSQL_PORT: "3306"
    CH_MYSQL_DB: contenthub_data
    CH_MYSQL_USER: ${MYSQL_USER:-chuser}
    CH_MYSQL_WRITE_PASSWD: ${MYSQL_PASSWORD}
    CH_REDIS_HOST: redis
    CH_ACCOUNT_SERVICE_URL: http://accountsvc:8160/acis
    CH_FILE_SERVER_URL: http://filesvc:8005/hfile
    CH_FILE_UPLOAD_URL: http://filesvc:8005/upload
    CH_SERVER_HOST: api
    CH_PUBLIC_BASE_URL: ${CH_PUBLIC_BASE_URL:-http://localhost:8080/}
    CH_MCP_UPSTREAM_HOST: api
    CH_MCP_UPSTREAM_PORT: "9978"
  volumes:
    - webdata:/data/webserver
    - filestorage:/data/filestorage
    - chdata:/data/contenthub/data
    - logs:/data/contenthub/log

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: contenthub_data
      MYSQL_USER: ${MYSQL_USER:-chuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # 建表 + 种子数据(幂等: CREATE TABLE IF NOT EXISTS), 跑完即退出
  init:
    <<: *backend
    restart: "no"
    command: ["init"]
    depends_on:
      mysql: { condition: service_healthy }

  accountsvc:
    <<: *backend
    command: ["accountsvc"]
    working_dir: /data/contenthub/accountsvc
    environment:
      ACIS_REDIS_HOST: redis
      ACIS_ADMIN_LOGINID: ${CH_ADMIN_LOGINID:-admin}
      ACIS_ADMIN_PASSWD: ${CH_ADMIN_PASSWD}
      ACIS_ALLOW_REGISTRATION: ${CH_ALLOW_REGISTRATION:-0}
    depends_on:
      redis: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      accountsvc: { condition: service_started }

  filesvc:
    <<: *backend
    command: ["filesvc"]
    depends_on:
      redis: { condition: service_healthy }

  render:
    <<: *backend
    command: ["render"]
    depends_on:
      init: { condition: service_completed_successfully }

  trans:
    <<: *backend
    command: ["trans"]
    depends_on:
      init: { condition: service_completed_successfully }

  mcp:
    <<: *backend
    command: ["mcp"]
    environment:
      <<: *backend-env
      MCP_AUTH_ISSUER_URL: ${CH_PUBLIC_BASE_URL:-http://localhost:8080/}
      MCP_AUTH_RESOURCE_SERVER_URL: ${CH_PUBLIC_BASE_URL:-http://localhost:8080/}
    depends_on:
      api: { condition: service_started }

  ops:
    <<: *backend
    command: ["ops"]
    depends_on:
      init: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: contenthub-web:latest
    restart: unless-stopped
    ports:
      - "${CH_HTTP_PORT:-8080}:80"
    volumes:
      - webdata:/data/webserver:ro
    depends_on:
      - api
      - filesvc

volumes:
  mysqldata:
  redisdata:
  webdata:
  filestorage:
  chdata:
  logs:
